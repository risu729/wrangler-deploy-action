#:schema https://mise.jdx.dev/schema/mise.json

[tools]
node = "26.10.0"
bun = "1.4.2"
hk = "2.5.0"
bats = "1.14.0"
actionlint = "1.7.12"
# required for actionlint
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "5.0.0"
zizmor = "1.30.1"
tombi = "1.7.3"
shfmt = "3.14.1"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.12.23"
yamllint = "1.38.0"
typos = "1.50.3"
"npm:semantic-release" = "25.0.9"

[settings]
experimental = true

[tasks.check]
description = "Run hk linters and formatters."
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = "hk {% if usage.lint %}check{% else %}fix{% endif %} --all --no-progress --no-fail-fast"

[tasks.test]
description = "Run deploy action tests."
run = "bats tests/deploy.bats"

[tasks.release]
description = "Publish a release from CI using Conventional Commits."
run = "semantic-release"

[tasks.test-integration]
description = "Run the complete real cf integration checks locally."
run = [
  { task = "integration:build" },
  { task = "integration:dry-run" },
  { task = "integration:verify" },
]
