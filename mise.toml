#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.19"

[tools]
node = "26.13.1"
bun = "1.4.4"
hk = "2.13.0"
bats = "1.14.0"
jactionlint = "v2.6.0"
# required for jactionlint
shellcheck = "0.11.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
tombi = "1.11.3"
shfmt = "3.14.1"
yamlfmt = "0.21.0"
# required for pypi backend
uv = "0.13.8"
yamllint = "1.38.0"
typos = "1.52.2"
"npm:semantic-release" = "25.0.9"

[settings]
# `[deps]` below is still experimental in mise 2026.11.8.
experimental = true
lockfile = true

[deps.bun]
dir = "tests/fixtures/worker"
run = "bun install --frozen-lockfile"

[tasks."integration:deps"]
description = "Install the pinned real cf fixture dependencies when needed."
# In mise 2026.11.8 the deps CLI still installs every configured tool, even after
# --skip-tools, so limit it to the tools the fixture install needs.
env.MISE_ENABLE_TOOLS = "node,bun"
run = "mise deps install bun"

[tasks.check]
description = "Run hk linters and formatters."
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = "hk {% if usage.lint %}check{% else %}fix{% endif %} --all --no-progress --no-fail-fast"

[tasks.test]
description = "Run deploy action tests."
run = "bats tests/deploy.bats"

[tasks.release]
description = "Publish a release from CI using Conventional Commits."
run = "semantic-release"

[tasks.test-integration]
description = "Run the complete real cf integration checks locally."
run = [
  { task = "integration:build" },
  { task = "integration:dry-run" },
  { task = "integration:verify" },
]
