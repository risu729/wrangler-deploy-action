name: Cloudflare Deploy
description: >-
  Publish prebuilt Cloudflare Workers with cf, Workers Previews, version URLs, and scoped tokens.
author: risu729
branding:
  icon: upload-cloud
  color: orange
inputs:
  mode:
    description: 'Operation: worker-preview, delete-preview, preview-or-dry-run, dry-run, or production.'
    required: true
  working-directory:
    description: Project directory relative to GITHUB_WORKSPACE.
    default: .
  worker:
    description: Exact Worker name in the prebuilt Cloudflare Build Output.
    required: true
  build-mode:
    description: Mode recorded by cf build; passed to cf with --mode.
    default: production
  preview-name:
    description: Exact Preview name required for worker-preview and delete-preview (for example pr-123).
  preview-alias:
    description: Stable version preview alias required by preview-or-dry-run.
  cloudflare-account-id:
    description: Cloudflare account ID required for authenticated operations.
  cloudflare-api-token:
    description: Cloudflare API token required for authenticated operations.
  secrets-json:
    description: Optional JSON object of string secrets uploaded with the production version.
  production-strategy:
    description: versions (default) or deploy; deploy applies Container applications and triggers together. Also selects the dry-run validation path.
    default: versions
  deploy-triggers:
    description: Explicitly apply configured routes, domains and other triggers after production deployment.
    default: 'false'
outputs:
  effective-mode:
    description: 'Operation performed, including worker-preview or delete-preview.'
    value: ${{ steps.deploy.outputs.effective-mode }}
  version-id:
    description: Uploaded Worker version UUID (empty for dry runs).
    value: ${{ steps.deploy.outputs.version-id }}
  deployment-id:
    description: Verified production or Workers Preview deployment ID.
    value: ${{ steps.deploy.outputs.deployment-id }}
  preview-url:
    description: Stable Workers Preview URL, or version URL for legacy modes.
    value: ${{ steps.deploy.outputs.preview-url }}
  preview-alias-url:
    description: Stable version preview URL in preview mode.
    value: ${{ steps.deploy.outputs.preview-alias-url }}
  preview-id:
    description: Verified Workers Preview resource ID (empty if already absent).
    value: ${{ steps.deploy.outputs.preview-id }}
  deployment-url:
    description: Immutable Workers Preview deployment URL.
    value: ${{ steps.deploy.outputs.deployment-url }}
  triggers-deployed:
    description: Whether explicitly requested trigger synchronization completed.
    value: ${{ steps.deploy.outputs.triggers-deployed }}
runs:
  using: composite
  steps:
    - name: Check cf
      if: inputs.mode != 'delete-preview'
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: '"${GITHUB_ACTION_PATH}/src/check-cf.sh"'
    - name: Deploy with cf
      id: deploy
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_WORKER: ${{ inputs.worker }}
        INPUT_BUILD_MODE: ${{ inputs.build-mode }}
        INPUT_PREVIEW_NAME: ${{ inputs.preview-name }}
        INPUT_PREVIEW_ALIAS: ${{ inputs.preview-alias }}
        INPUT_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        INPUT_CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        INPUT_SECRETS_JSON: ${{ inputs.secrets-json }}
        INPUT_PRODUCTION_STRATEGY: ${{ inputs.production-strategy }}
        INPUT_DEPLOY_TRIGGERS: ${{ inputs.deploy-triggers }}
      run: '"${GITHUB_ACTION_PATH}/src/deploy.sh"'
