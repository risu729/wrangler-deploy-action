name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Lint
        run: mise run check --lint
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Test
        run: mise run test
      - name: Use fake mise and cf
        run: |
          echo "${GITHUB_WORKSPACE}/tests/fake-bin" >> "${GITHUB_PATH}"
          mkdir -p tests/fixtures/worker/.cloudflare/output/v0
          echo '{}' > tests/fixtures/worker/.cloudflare/output/v0/config.json
      - name: Test preview action
        id: preview
        uses: ./ # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
        with:
          mode: preview-or-dry-run
          working-directory: tests/fixtures/worker
          worker: worker
          preview-alias: pr-42
          cloudflare-account-id: account
          cloudflare-api-token: token
      - name: Check preview outputs
        env:
          EFFECTIVE_MODE: ${{ steps.preview.outputs.effective-mode }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_ALIAS_URL: ${{ steps.preview.outputs.preview-alias-url }}
        run: |
          [[ "${EFFECTIVE_MODE}" == "preview" ]]
          [[ "${PREVIEW_URL}" == "https://version-worker.example.workers.dev" ]]
          [[ "${PREVIEW_ALIAS_URL}" == "https://pr-42-worker.example.workers.dev" ]]
      - name: Test dry-run fallback action
        id: dry-run
        uses: ./ # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
        with:
          mode: preview-or-dry-run
          working-directory: tests/fixtures/worker
          worker: worker
          preview-alias: pr-42
      - name: Check dry-run output
        env:
          EFFECTIVE_MODE: ${{ steps.dry-run.outputs.effective-mode }}
        run: test "${EFFECTIVE_MODE}" = "dry-run"
      - name: Test production action
        id: production
        uses: ./ # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
        with:
          mode: production
          working-directory: tests/fixtures/worker
          worker: worker
          cloudflare-account-id: account
          cloudflare-api-token: token
      - name: Check production outputs
        env:
          EFFECTIVE_MODE: ${{ steps.production.outputs.effective-mode }}
          VERSION_ID: ${{ steps.production.outputs.version-id }}
          DEPLOYMENT_ID: ${{ steps.production.outputs.deployment-id }}
          TRIGGERS_DEPLOYED: ${{ steps.production.outputs.triggers-deployed }}
        run: |
          [[ "${EFFECTIVE_MODE}" == "production" ]]
          [[ "${VERSION_ID}" == '11111111-1111-4111-8111-111111111111' ]]
          [[ "${DEPLOYMENT_ID}" == '22222222-2222-4222-8222-222222222222' ]]
          [[ "${TRIGGERS_DEPLOYED}" == false ]]
  cf-integration:
    name: cf Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_NODE_VERSION: "26.10.0"
      MISE_BUN_VERSION: "1.4.2"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
          working_directory: ${{ runner.temp }}
          install_args: node@26.10.0 bun@1.4.2
          cache_key: cf-integration-{{platform}}-mise-{{version}}-node-26.10.0-bun-1.4.2
      - name: Build real fixture with pinned cf
        working-directory: tests/fixtures/worker
        run: |
          bun install --frozen-lockfile
          bun run cf build
          find .cloudflare/output -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/build.sha256"
      - name: Validate prebuilt Worker with the action
        id: cf
        uses: ./ # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
        with:
          mode: dry-run
          working-directory: tests/fixtures/worker
          worker: worker
      - name: Check output and unchanged build
        working-directory: tests/fixtures/worker
        env:
          EFFECTIVE_MODE: ${{ steps.cf.outputs.effective-mode }}
        run: |
          test "${EFFECTIVE_MODE}" = dry-run
          sha256sum --check "${RUNNER_TEMP}/build.sha256"
      - name: Reject a mismatched build mode
        env:
          INPUT_MODE: dry-run
          INPUT_WORKING_DIRECTORY: tests/fixtures/worker
          INPUT_WORKER: worker
          INPUT_BUILD_MODE: staging
        run: |
          if src/deploy.sh > "${RUNNER_TEMP}/mode.log" 2>&1; then
            echo 'Expected cf to reject the mismatched mode.' >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/mode.log"
          grep -F 'The Build Output was created with mode' "${RUNNER_TEMP}/mode.log"
      - name: Build real Preview output
        working-directory: tests/fixtures/worker
        run: |
          bun run cf-vite build --preview
          jq -e '.buildContext.isPreview == true and .buildContext.mode == "production"' .cloudflare/output/v0/config.json
      - name: Reject Preview output for production version validation
        env:
          INPUT_MODE: dry-run
          INPUT_WORKING_DIRECTORY: tests/fixtures/worker
          INPUT_WORKER: worker
        run: |
          if src/deploy.sh > "${RUNNER_TEMP}/preview-mode.log" 2>&1; then
            echo 'Expected cf to reject Preview output for a production version.' >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/preview-mode.log"
          grep -F 'Preview' "${RUNNER_TEMP}/preview-mode.log"
  ci-check:
    name: CI Check
    needs:
      - lint
      - test
      - cf-integration
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: exit 1
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # for actions-timeline
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
