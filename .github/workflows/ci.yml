name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
      - name: Lint
        run: mise run check --lint
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
      - name: Test
        run: mise run test
      - name: Use fake mise and cf
        run: |
          echo "${GITHUB_WORKSPACE}/tests/fake-bin" >> "${GITHUB_PATH}"
          mkdir -p tests/fixtures/worker/.cloudflare/output/v0
          echo '{}' > tests/fixtures/worker/.cloudflare/output/v0/config.json
      - name: Test preview action
        id: preview
        uses: ./ # zizmor: ignore[self-repository] -- Exercise the checked-out local action.
        with:
          mode: preview-or-dry-run
          working-directory: tests/fixtures/worker
          worker: worker
          preview-alias: pr-42
          cloudflare-account-id: account
          cloudflare-api-token: token
      - name: Check preview outputs
        env:
          EFFECTIVE_MODE: ${{ steps.preview.outputs.effective-mode }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_ALIAS_URL: ${{ steps.preview.outputs.preview-alias-url }}
        run: |
          [[ "${EFFECTIVE_MODE}" == "preview" ]]
          [[ "${PREVIEW_URL}" == "https://version-worker.example.workers.dev" ]]
          [[ "${PREVIEW_ALIAS_URL}" == "https://pr-42-worker.example.workers.dev" ]]
      - name: Test dry-run fallback action
        id: dry-run
        uses: ./ # zizmor: ignore[self-repository] -- Exercise the checked-out local action.
        with:
          mode: preview-or-dry-run
          working-directory: tests/fixtures/worker
          worker: worker
          preview-alias: pr-42
      - name: Check dry-run output
        env:
          EFFECTIVE_MODE: ${{ steps.dry-run.outputs.effective-mode }}
        run: test "${EFFECTIVE_MODE}" = "dry-run"
      - name: Test production action
        id: production
        uses: ./ # zizmor: ignore[self-repository] -- Exercise the checked-out local action.
        with:
          mode: production
          working-directory: tests/fixtures/worker
          worker: worker
          cloudflare-account-id: account
          cloudflare-api-token: token
      - name: Check production outputs
        env:
          EFFECTIVE_MODE: ${{ steps.production.outputs.effective-mode }}
          VERSION_ID: ${{ steps.production.outputs.version-id }}
          DEPLOYMENT_ID: ${{ steps.production.outputs.deployment-id }}
          TRIGGERS_DEPLOYED: ${{ steps.production.outputs.triggers-deployed }}
        run: |
          [[ "${EFFECTIVE_MODE}" == "production" ]]
          [[ "${VERSION_ID}" == '11111111-1111-4111-8111-111111111111' ]]
          [[ "${DEPLOYMENT_ID}" == '22222222-2222-4222-8222-222222222222' ]]
          [[ "${TRIGGERS_DEPLOYED}" == false ]]
  cf-integration:
    name: cf Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          install_args: node bun
      - name: Build real fixture with pinned cf
        run: mise run --skip-tools integration:build
      - name: Validate prebuilt Worker with the action
        id: cf
        uses: ./ # zizmor: ignore[self-repository] -- Exercise the checked-out local action.
        with:
          mode: dry-run
          working-directory: tests/fixtures/worker
          worker: worker
      - name: Check output and verify real cf behavior
        env:
          EFFECTIVE_MODE: ${{ steps.cf.outputs.effective-mode }}
        run: |
          test "${EFFECTIVE_MODE}" = dry-run
          mise run --skip-tools integration:verify
  ci-check:
    name: CI Check
    needs:
      - lint
      - test
      - cf-integration
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: exit 1
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # for actions-timeline
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
